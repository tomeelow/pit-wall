[project]
name = "pitwall"
version = "0.1.0"
description = "Pit Wall pipeline: ingest, fit and export F1 strategy models"
authors = [
    { name = "Ivan Tomilo", email = "153078768+tomeelow@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastf1>=3.9.2",
    "loguru>=0.8.0",
    "numpy>=2.4,<2.5",  # pandas 2.3 uses generic timedelta units, deprecated in numpy 2.5
    "pandas>=2.3.3",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
pitwall = "pitwall.cli:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas-stubs>=2.3,<2.4",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# T20: logging over print. DTZ: no naive datetimes (everything is UTC).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "T20", "DTZ"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
