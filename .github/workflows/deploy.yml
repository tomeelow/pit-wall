name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Raw OpenF1 responses: a finished session is downloaded once, not on every deploy.
      - uses: actions/cache@v6
        with:
          path: .data/openf1-cache.sqlite
          key: openf1-cache-v1-${{ github.run_id }}
          restore-keys: openf1-cache-v1-
      - run: make setup
      # Walking skeleton: one fixed race. Phase 11 replaces this with the season calendar.
      - run: make ingest SEASON=2024 ROUND=1
      - run: make export
      - run: make build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
