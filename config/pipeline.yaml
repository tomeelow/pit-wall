# Pipeline paths are relative to the repository root.
data_dir: .data               # raw API cache and canonical parquet tables (gitignored)
bundle_dir: web/public/data   # exported static bundle served by the web app (gitignored)

openf1_url: https://api.openf1.org/v1
# The season calendar changes as races finish; every other response is final and cached forever.
calendar_cache_hours: 6
# A race counts as finished (and is ingested by a season run) this long after its scheduled end.
min_hours_after_race: 12

validation:
  # Lap times outside [min, max] x the race's median lap time are reported. Slow laps are normal
  # (SC, pit, red flag); the bounds only catch timing garbage.
  lap_time_min_factor: 0.9
  lap_time_max_factor: 5.0
  # Share of driver-laps whose reconstructed position must match OpenF1's position feed at the
  # line; below it the race state is reported as suspect.
  min_position_agreement: 0.95
  # OpenF1's position feed updates up to a second or two after the line; probe it this late.
  position_lag_s: 1.0

# Lap classification (Phase 2). Initial values: tune with evidence, never to flatter a model.
classification:
  # A lap started within this gap (s) to the car physically ahead, at the line, is a traffic lap.
  traffic_gap_s: 1.5
  # After every other class is removed, a lap slower than this x the driver's stint median is an
  # outlier (mistakes, damage, unflagged incidents).
  outlier_factor: 1.05
  # A sector yellow lasts at most this long (s). Some yellows are never cleared in race control
  # and would otherwise cover the rest of the race; the longest cleared one in 2024 was 827 s.
  max_yellow_s: 900
