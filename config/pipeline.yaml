# Pipeline paths are relative to the repository root.
data_dir: .data               # raw API cache and canonical parquet tables (gitignored)
bundle_dir: web/public/data   # exported static bundle served by the web app (gitignored)

openf1_url: https://api.openf1.org/v1
# The season calendar changes as races finish; every other response is final and cached forever.
calendar_cache_hours: 6
# A race counts as finished (and is ingested by a season run) this long after its scheduled end.
min_hours_after_race: 12

validation:
  # Lap times outside [min, max] x the race's median lap time are reported. Slow laps are normal
  # (SC, pit, red flag); the bounds only catch timing garbage.
  lap_time_min_factor: 0.9
  lap_time_max_factor: 5.0
  # Share of driver-laps whose reconstructed position must match OpenF1's position feed at the
  # line; below it the race state is reported as suspect.
  min_position_agreement: 0.95
  # OpenF1's position feed updates up to a second or two after the line; probe it this late.
  position_lag_s: 1.0

# Lap classification (Phase 2). Initial values: tune with evidence, never to flatter a model.
classification:
  # A lap started within this gap (s) to the car physically ahead, at the line, is a traffic lap.
  traffic_gap_s: 1.5
  # After every other class is removed, a lap slower than this x the driver's stint median is an
  # outlier (mistakes, damage, unflagged incidents).
  outlier_factor: 1.05
  # A sector yellow lasts at most this long (s). Some yellows are never cleared in race control
  # and would otherwise cover the rest of the race; the longest cleared one in 2024 was 827 s.
  max_yellow_s: 900

# Tyre degradation model (Phase 3). Fitted on `clean` dry laps with a C-number, per era.
degradation:
  sampler:
    chains: 4
    tune: 1000
    draws: 1000
    # Above the 0.8 default: the hierarchy's scale terms form funnels that diverge at 0.8.
    target_accept: 0.95
    seed: 20260301
  # A C-number is modelled only with clean laps from at least this many races of the era. With
  # one race its era and race terms can't be told apart (2025 Monaco's C6: 13 laps); races using
  # it get no draws for that C-number rather than a guess.
  min_compound_races: 2
  # Posterior draws exported per race; each simulator run samples one.
  export_draws: 200
  # Prior scales (s). Slope priors are the same for every C-number: the data, not us, order them.
  priors:
    slope_s_per_lap: {mean: 0.05, sd: 0.1}
    slope_track_sd: 0.05     # half-normal scale: track deviation from the era/C-number slope
    slope_team_sd: 0.03      # half-normal scale: team deviation from the track slope
    compound_offset_sd: 1.0  # era-level C-number offset
    compound_track_sd: 0.5   # half-normal scale: race deviation from the era offset
    race_level_sd: 5.0       # race level, relative to the race's median clean lap
    pace_sd: 1.0             # half-normal scale: driver spread around the race level
    noise_sd: 0.5            # half-normal scale of the per-race lap noise
  # Publish gate: a fit failing any of these is not exported; previous draws stay live.
  gate:
    max_rhat: 1.01
    min_ess: 400
    max_divergences: 0
  # Leave-one-race-out: every method sees the first `anchor_laps` clean laps of each held-out
  # stint and forecasts the rest (stints need at least `min_forecast_laps` more clean laps).
  backtest:
    # Same model and sampler, fewer draws: forecasts use posterior means, and 15 full-length
    # refits would take hours. Each refit's diagnostics are reported, not gated.
    sampler:
      chains: 4
      tune: 500
      draws: 500
      target_accept: 0.95
      seed: 20260301
    anchor_laps: 3
    min_forecast_laps: 3
    # Fixed, stratified: both eras, high and low degradation, street tracks, red flags, mixed
    # weather. Changing it changes the reported numbers; never pick races to flatter the model.
    races:
      - [2023, 1]    # Bahrain: high degradation
      - [2023, 3]    # Australia: three red flags
      - [2023, 17]   # Qatar: high degradation
      - [2024, 8]    # Monaco: low degradation
      - [2024, 10]   # Spain
      - [2024, 12]   # Britain: mixed weather
      - [2024, 13]   # Hungary
      - [2024, 18]   # Singapore: street
      - [2025, 7]    # Emilia Romagna
      - [2025, 14]   # Hungary
      - [2025, 16]   # Italy: low degradation
      - [2025, 22]   # Las Vegas: street, cold
      - [2026, 6]    # Monaco
      - [2026, 11]   # Hungary
      - [2026, 13]   # Italy: red flag

# Pit loss, neutralisations and retirements (Phase 4).
events:
  pit_loss:
    # A stop's loss is measured against the median lap of the cars running normally on its in- and
    # out-lap, corrected by the driver's own median gap to that field on clean laps. Laps with
    # fewer comparison cars than this give no reference.
    min_field_cars: 5
    # Lane time above this x the race's median lane time is a penalty, repair or red-flag queue,
    # not a tyre stop.
    max_lane_factor: 1.5
  hazards:
    # A fit takes seconds, and every race gets its own masked refit, each gated: long chains and a
    # high target keep rare families (three lap-1 red flags; their unit_sd funnels) under the gate.
    sampler:
      chains: 4
      tune: 1500
      draws: 2000
      target_accept: 0.98
      seed: 20260302
    priors:
      # Log events per lap (running) or per start (lap 1). exp(-4.5) ~ 0.011: about one SC every
      # 90 laps. Wide: the data, not the prior, should set every rate.
      log_rate: {mean: -4.5, sd: 2.0}
      # Half-normal scale of a track's (or team's) log-rate deviation from its era. Three or four
      # races per track cannot identify the spread; 0.5 still lets a track run at ~2.7x its era's
      # rate at two sd (street circuits), and keeps the rare red-flag family out of a funnel.
      unit_sd: 0.5
    gate:
      max_rhat: 1.01
      min_ess: 400
      max_divergences: 0
    export_draws: 200
    # Leave-one-season-out validation of the neutralisation rates. 2026 is not held out: with no
    # 2026 race in training its era level would be prior only.
    validation_seasons: [2023, 2024, 2025]
